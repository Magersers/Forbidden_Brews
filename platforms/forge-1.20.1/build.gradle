plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods { forbidden_brews { source sourceSets.main } }
        }
        client {
            workingDirectory project.file('run')
            mods { forbidden_brews { source sourceSets.main } }
        }
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', 'forbidden_brews'
            mods { forbidden_brews { source sourceSets.main } }
        }
    }
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.0' }
jar { finalizedBy 'reobfJar' }
apply from: '../../platform-common.gradle'
if (providers.gradleProperty('gameTests').isPresent()) {
    sourceSets.main.java.srcDir('../../integration/forge/src/main/java')
    sourceSets.main.resources.srcDir('../../integration/forge/src/main/resources')
}
