plugins { id 'fabric-loom' version '1.7.4' }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
loom {
    accessWidenerPath = file('src/main/resources/forbidden_brews.accesswidener')
    runs { server { programArg 'nogui' } }
}
apply from: '../../platform-common.gradle'
